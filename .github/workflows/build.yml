name: build-site

on:
  schedule:
    - cron: "17 * * * *"      # 每小时 17 分构建一次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取 + 过滤 + 生成
        env:
          YOUHUB_API_KEY: ${{ secrets.YOUHUB_API_KEY }}
          AI_DAILY_CLOUD: "1"
        run: python bin/ai_daily.py --quiet

      - name: 补静态路由（/sources、/kb/）
        run: |
          mkdir -p output/sources output/kb
          cp -f output/sources.html output/sources/index.html 2>/dev/null || true

      - name: 发布到 gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          force_orphan: true
